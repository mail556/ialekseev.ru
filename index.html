денциальность</a></footer></main><script id="redirect-copy">(()=>{const path=location.pathname;const destination='https://airbeat.ru'+path+location.search+location.hash;document.getElementById('destination').href=destination;document.querySelector('link[rel=canonical]').href='https://airbeat.ru'+path;let saved=null;try{saved=localStorage.getItem('radioair:language')}catch{}let zone='';try{zone=Intl.DateTimeFormat().resolvedOptions().timeZone}catch{}const russian=saved==='ru'||saved!=='en'&&(Array.from(navigator.languages||[navigator.language]).some(v=>/^ru(?:-|$)/i.test(v))||/^(Europe\/(Kaliningrad|Moscow|Volgograd|Samara|Astrakhan|Saratov|Ulyanovsk|Kirov)|Asia\/(Yekaterinburg|Omsk|Novosibirsk|Barnaul|Tomsk|Novokuznetsk|Krasnoyarsk|Irkutsk|Chita|Yakutsk|Khandyga|Vladivostok|Ust-Nera|Sakhalin|Magadan|Kamchatka|Anadyr))$/.test(zone));if(!russian){document.documentElement.lang='en';document.getElementById('message').textContent='AirStudio has moved to airbeat.ru. You will be redirected automatically once its secure connection is available.';document.getElementById('note').textContent='If you are still here, HTTPS for the new domain may be getting ready. You can open the link later.';document.getElementById('privacy').textContent='Privacy'}})();</script><script id="domain-migration">(()=>{
